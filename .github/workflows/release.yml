# Nahraje balíčky k vydání na GitHubu. Spouští se značkou v* (třeba v1.0.1).
# Aplikace stahuje DatovkaNG-macos.zip, DatovkaNG-linux-amd64.deb
# a DatovkaNG-windows-amd64.zip; DatovkaNG-android.apk se instaluje ručně.
# Text vydání je docs/vydani/<značka>.md, ukazuje se i v aplikaci.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Balíčky systému
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Jádro
        run: cargo build --release -p datovka-ffi
      - name: Aplikace
        working-directory: app
        run: flutter build linux --release
      - name: Balíček deb
        run: |
          bundle=app/build/linux/x64/release/bundle
          cp target/release/libdatovka_ffi.so "$bundle/lib/"
          ver=$(sed -n 's/^version: //p' app/pubspec.yaml | cut -d+ -f1)
          chmod +x scripts/package-deb.sh
          scripts/package-deb.sh "$bundle" "$ver" dist/DatovkaNG-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/DatovkaNG-linux-amd64.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Aplikace a archiv
        run: |
          scripts/build-macos.sh
          app=app/build/macos/Build/Products/Release/datovka-ng.app
          ditto -c -k --keepParent "$app" dist/DatovkaNG-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/DatovkaNG-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Jádro
        run: cargo build --release -p datovka-ffi
      - name: Aplikace
        working-directory: app
        run: flutter build windows --release
      - name: Balíček zip
        shell: pwsh
        run: |
          $out = "app/build/windows/x64/runner/Release"
          Copy-Item target/release/datovka_ffi.dll $out
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out/*" -DestinationPath dist/DatovkaNG-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/DatovkaNG-windows-amd64.zip

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Jádro
        run: |
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          [ -d "$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo build --release -p datovka-ffi --target aarch64-linux-android
          mkdir -p app/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libdatovka_ffi.so app/android/app/src/main/jniLibs/arm64-v8a/
      # Every release with the same key, so a new version installs over the old one.
      - name: Podpisový klíč
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Chybí secrets ANDROID_KEYSTORE_B64 a ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > app/android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=datovka\nkeyPassword=%s\n' \
            "$PASSWORD" "$PASSWORD" > app/android/key.properties
      - name: Aplikace
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64
      - name: Balíček apk
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/DatovkaNG-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/DatovkaNG-android.apk

  publish:
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/vydani/${{ github.ref_name }}.md"
          [ -f "$notes" ] || { echo "Balíčky Datovky NG. Program se nesmí prodávat." > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "${{ github.ref_name }}" dist/DatovkaNG-macos.zip dist/DatovkaNG-linux-amd64.deb \
            dist/DatovkaNG-windows-amd64.zip dist/DatovkaNG-android.apk \
            --repo "${{ github.repository }}" \
            --title "Datovka NG ${{ github.ref_name }}" \
            --notes-file "$notes"
