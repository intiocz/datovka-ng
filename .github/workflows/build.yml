# Tests and builds Datovka NG for Linux and Windows (GitHub Actions and Gitea Actions).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Rust core
        run: cargo build --release -p datovka-ffi
      - name: Rust tests
        run: cargo test --release
      - name: Flutter tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Flutter app
        working-directory: app
        run: flutter build linux --release
      - name: Bundle core and package
        run: |
          bundle=app/build/linux/x64/release/bundle
          cp target/release/libdatovka_ffi.so "$bundle/lib/"
          tar -C "$bundle/.." -czf DATOVKA-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: DATOVKA-linux-x64
          path: DATOVKA-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Rust core
        run: cargo build --release -p datovka-ffi
      - name: Rust tests
        run: cargo test --release
      - name: Flutter tests
        working-directory: app
        run: |
          flutter pub get
          flutter test
      - name: Flutter app
        working-directory: app
        run: flutter build windows --release
      - name: Bundle core and package
        shell: pwsh
        run: |
          $out = "app/build/windows/x64/runner/Release"
          Copy-Item target/release/datovka_ffi.dll $out
          Compress-Archive -Path "$out/*" -DestinationPath DATOVKA-windows-x64.zip
      # Starts the built app with an empty archive, takes a picture of the
      # screen and fails when the app does not stay up.
      - name: Start the app
        shell: pwsh
        run: |
          $exe = Resolve-Path "app/build/windows/x64/runner/Release/datovka-ng.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows-screen.png")
          if ($p.HasExited) {
            Write-Error "Aplikace skončila s kódem $($p.ExitCode)."
            exit 1
          }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screen
          path: windows-screen.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: DATOVKA-windows-x64
          path: DATOVKA-windows-x64.zip
